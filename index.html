<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출근해도 익명으로 대화해야 하는구나</title>
<meta property="og:title" content="출근해도 익명으로 대화해야 하는구나">
<meta property="og:description" content="괴담에 떨어져도 출근을 해야 하는구나 팬 사이트 · 나만의 익명 질문함을 만들어보세요">
<meta property="og:image" content="https://gdcg-anonymity.github.io/QnA/og-banner.png">
<meta property="og:url" content="https://gdcg-anonymity.github.io/QnA/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="출근해도 익명으로 대화해야 하는구나">
<meta name="twitter:description" content="괴담에 떨어져도 출근을 해야 하는구나 팬 사이트 · 나만의 익명 질문함을 만들어보세요">
<meta name="twitter:image" content="https://gdcg-anonymity.github.io/QnA/og-banner.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="landing">
    <h1 class="landing-title">출근해도 익명으로<br>대화해야 하는구나</h1>
    <p class="landing-sub">"괴담에 떨어져도 출근을 해야 하는구나" 팬 사이트<br>나만의 익명 질문함을 만들어보세요</p>

    <div class="landing-tabs">
      <button class="tab-btn active" id="tabCreate" type="button">새로 만들기</button>
      <button class="tab-btn" id="tabLogin" type="button">로그인</button>
    </div>

    <form id="createForm" class="landing-form">
      <label>아이디</label>
      <input type="text" id="createId" placeholder="영문/숫자/밑줄, 3~20자" required>
      <label>비밀번호</label>
      <input type="password" id="createPw" placeholder="6자 이상" required>
      <label>비밀번호 확인</label>
      <input type="password" id="createPwConfirm" placeholder="한 번 더 입력" required>
      <p class="warning-note">비밀번호를 잊으면 되찾을 방법이 없어요. 운영자도 대신 바꿔줄 수 없으니 꼭 기억해두세요.</p>
      <label>표시할 닉네임</label>
      <input type="text" id="createNickname" placeholder="예: 곽제강" required>
      <label>테마 선택</label>
      <div class="theme-row">
        <button type="button" class="theme-btn active" data-theme="daydream" data-color="#185FA5">
          <span class="theme-name">Daydream Inc.</span>
          <span class="theme-sub">백일몽 주식회사</span>
        </button>
        <button type="button" class="theme-btn" data-theme="disaster" data-color="#B23A2E">
          <span class="theme-name">초자연 재난관리국</span>
          <span class="theme-sub">긴급 대응 채널</span>
        </button>
        <button type="button" class="theme-btn" data-theme="basic" data-color="#3A3A38">
          <span class="theme-name">기본 테마</span>
          <span class="theme-sub">담백하고 깔끔하게</span>
        </button>
      </div>
      <input type="hidden" id="createTheme" value="daydream">
      <p class="modal-error" id="createError" hidden></p>
      <button type="submit" class="btn-primary wide">익명함 만들기</button>
    </form>

    <form id="loginForm" class="landing-form" hidden>
      <label>아이디</label>
      <input type="text" id="loginId" placeholder="아이디" required>
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호" required>
      <p class="modal-error" id="loginErrorLanding" hidden></p>
      <button type="submit" class="btn-primary wide">로그인</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="landing-app.js"></script>
</body>
</html>
