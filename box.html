<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출근해도 익명으로 대화해야 하는구나</title>
<meta property="og:title" content="출근해도 익명으로 대화해야 하는구나">
<meta property="og:description" content="괴담에 떨어져도 출근을 해야 하는구나 팬 사이트 · 익명 질문함">
<meta property="og:image" content="https://gdcg-anonymity.github.io/QnA/og-banner.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="출근해도 익명으로 대화해야 하는구나">
<meta name="twitter:description" content="괴담에 떨어져도 출근을 해야 하는구나 팬 사이트 · 익명 질문함">
<meta name="twitter:image" content="https://gdcg-anonymity.github.io/QnA/og-banner.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="decoLayer"></div>
  <button id="decoAdjustDone" class="deco-adjust-done" type="button">위치 조정 완료</button>

  <div id="app">

    <a href="index.html" class="workspace" id="workspaceBar">
      <img src="daydream_logo.png" alt="로고" class="logo-img" id="workspaceLogo">
      <div>
        <p class="workspace-name" id="workspaceName">Daydream Inc.</p>
        <p class="workspace-sub" id="workspaceSub">백일몽 주식회사</p>
      </div>
    </a>

    <div class="dm-header">
      <div class="dm-left">
        <div class="avatar" id="mainAvatar"></div>
        <div>
          <p class="name" id="boxNickname">&nbsp;</p>
          <p class="status" id="statusLine">불러오는 중...</p>
        </div>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>

    <div class="chat" id="chatFeed">
      <p class="empty-state" id="emptyState">아직 아무도 흥미로운 걸 안 물어봤군요.</p>
    </div>

    <div class="composer-wrap">
      <div class="composer-image-preview" id="composerImagePreview" hidden>
        <img id="composerImageThumb" alt="첨부한 사진 미리보기">
        <button type="button" id="composerImageRemove" aria-label="사진 제거">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <form class="composer" id="composerForm">
        <button type="button" class="attach-btn" id="attachBtn" hidden aria-label="사진 첨부">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
        </button>
        <input type="file" id="composerImageInput" accept="image/*" hidden>
        <input type="text" id="questionInput" placeholder="익명 메시지를 입력하세요" maxlength="300" autocomplete="off">
        <button type="submit" class="send-btn" aria-label="전송">
          <span class="send-icon"></span>
        </button>
      </form>
    </div>

  </div>

  <!-- 슬라이드 메뉴 -->
  <div class="sheet-backdrop" id="menuBackdrop">
    <div class="sheet" id="menuSheet">
      <a href="index.html" class="sheet-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
        <span>메인으로</span>
      </a>
      <button class="sheet-item" id="copyLinkMenuItem">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>링크 복사</span>
      </button>
      <button class="sheet-item" id="loginMenuItem">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        <span>관리자 로그인</span>
      </button>
      <button class="sheet-item" id="profileMenuItem" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>프로필 설정</span>
      </button>
      <button class="sheet-item" id="decoAdjustMenuItem" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l3 3 3-3"/><path d="M19 9l3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/></svg>
        <span>장식 위치 조정</span>
      </button>
      <button class="sheet-item" id="logoutMenuItem" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>로그아웃</span>
      </button>
    </div>
  </div>

  <!-- 로그인 모달 -->
  <div class="sheet-backdrop" id="loginBackdrop">
    <div class="modal">
      <p class="modal-title">관리자 로그인</p>
      <input type="password" id="passwordInput" placeholder="비밀번호" autocomplete="current-password">
      <p class="modal-error" id="loginError" hidden></p>
      <div class="modal-actions">
        <button class="btn-ghost" id="loginCancel">취소</button>
        <button class="btn-primary" id="loginSubmit">로그인</button>
      </div>
    </div>
  </div>

  <!-- 프로필 설정 모달 -->
  <div class="sheet-backdrop" id="profileBackdrop">
    <div class="modal profile-modal">
      <p class="modal-title">프로필 설정</p>

      <div class="settings-scroll">

        <label>프로필 사진</label>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview"></div>
          <input type="file" id="avatarFileInput" accept="image/*">
        </div>

        <label>표정 이미지 (답변 달 때 골라 쓸 수 있어요)</label>
        <div class="expr-list" id="exprList"></div>
        <div class="expr-add-row">
          <input type="text" id="exprLabelInput" placeholder="표정 이름 (예: 흥미로움)" maxlength="10">
          <input type="file" id="exprFileInput" accept="image/*">
          <button type="button" class="btn-ghost" id="exprAddBtn">추가</button>
        </div>

        <label>닉네임</label>
        <input type="text" id="nicknameInput" maxlength="20">

        <label>색상</label>
        <div class="color-row" id="colorRow">
          <button type="button" class="color-swatch" data-color="#185FA5" style="background:#185FA5"></button>
          <button type="button" class="color-swatch" data-color="#B23A2E" style="background:#B23A2E"></button>
          <button type="button" class="color-swatch" data-color="#3B6D11" style="background:#3B6D11"></button>
          <button type="button" class="color-swatch" data-color="#854F0B" style="background:#854F0B"></button>
          <button type="button" class="color-swatch" data-color="#534AB7" style="background:#534AB7"></button>
          <button type="button" class="color-swatch" data-color="#993556" style="background:#993556"></button>
        </div>

        <label>지금 상태</label>
        <div class="preset-row" id="presetRow"></div>
        <div class="two-col">
          <input type="text" id="statusNoteInput" placeholder="한마디 (선택)" maxlength="40">
          <input type="text" id="locationInput" placeholder="위치 (선택)" maxlength="20">
        </div>

        <label>배경화면</label>
        <div class="avatar-row">
          <div class="bg-preview" id="bgPreview"></div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <input type="file" id="bgFileInput" accept="image/*">
            <button type="button" class="btn-ghost" id="bgClearBtn" style="align-self:flex-start; padding:4px 0;">배경 없애기</button>
          </div>
        </div>

        <label>트위터 프로필 링크</label>
        <input type="text" id="twitterInput" placeholder="https://x.com/아이디">

        <label>PC 화면 코너 장식 (여러 개 추가 가능, 사진/움짤)</label>
        <div class="expr-list" id="decoList"></div>
        <div class="expr-add-row">
          <input type="file" id="decoFileInput" accept="image/*">
          <button type="button" class="btn-ghost" id="decoAddBtn">추가</button>
        </div>

        <div class="toggle-row">
          <span>시간 표시</span>
          <button type="button" class="toggle-switch" id="showTimeToggle" aria-pressed="true"><span class="toggle-knob"></span></button>
        </div>

        <div class="toggle-row">
          <span>질문에 사진 첨부 허용</span>
          <button type="button" class="toggle-switch" id="allowImageToggle" aria-pressed="false"><span class="toggle-knob"></span></button>
        </div>

      </div>

      <p class="modal-error" id="profileError" hidden></p>
      <div class="modal-actions">
        <button class="btn-ghost" id="profileCancel">취소</button>
        <button class="btn-primary" id="profileSubmit">저장</button>
      </div>
    </div>
  </div>

  <!-- 답변 작성 모달 -->
  <div class="sheet-backdrop" id="answerBackdrop">
    <div class="modal">
      <p class="modal-title" id="answerModalTitle">답변 작성</p>
      <p class="modal-question" id="answerQuestionText"></p>
      <textarea id="answerInput" rows="3" placeholder="답변을 입력하세요" maxlength="1000"></textarea>
      <div class="expression-row">
        <button type="button" class="expression-btn" id="expressionBtn" aria-label="표정 선택"></button>
        <span class="expression-label" id="expressionLabel">기본</span>
      </div>
      <div class="expression-picker" id="expressionPicker" hidden></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="answerCancel">취소</button>
        <button class="btn-primary" id="answerSubmit">답변 게시</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="box-app.js"></script>
</body>
</html>
